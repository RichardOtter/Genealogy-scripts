# DEV_RM-Python-config.ini

[FILE_PATHS]
DB_PATH         = DB\TEST-Citation name updater.rmtree

#RMNOCASE_PATH   = C:\Users\rotter\Genealogy\GeneDB\SW\SQLite extensions\unifuzz64.dll
RMNOCASE_PATH   = C:\Users\rotter\Genealogy\GeneDB\SW\SQLite extensions\RMNOCASE_surrogate.dll

REGEXP_PATH     = C:\Users\rotter\Genealogy\GeneDB\SW\SQLite extensions\regexp.dll

# https://github.com/nalgeon/sqlean/blob/main/docs/regexp.md
# https://github.com/nalgeon/sqlean/releases
# sqlean-win-x64.zip


REPORT_FILE_PATH  = DEV_REPORT_Citation name updater.txt

#REPORT_FILE_DISPLAY_APP  = C:\Windows\system32\Notepad.exe
REPORT_FILE_DISPLAY_APP  = C:\Users\rotter\AppData\Local\Programs\Microsoft VS Code\bin\code.cmd
  --new-window


[FILTER]
USE_REGEXP = off
SOURCE_TEMPLATE =
SOURCE_NAME = 
CITATION_NAME =

# exclude if contains string1
# ^(?!.*string1).*$

# exclude if contains string1 or string2
# ^(?!.*(string1|string2)).*$

# exclude if contains a YYYY > 1900
# ^(?!.*(190[1-9]|19[1-9][0-9]|[2-9][0-9]{3})).*$

[CITATION_NAME_UPDATER]
MAKE_CHANGES = on

TEMPLATE_DEFAULT = on
# if on, use each source template's default cit name
#if off, either TEMPLATE_FROM_SOURCE_TEMPLATE or CUSTOM_TEMPLATE needs to be set

TEMPLATE_FROM_SOURCE_TEMPLATE = off
# if on and template has blank CitationName template, use default template

CUSTOM_TEMPLATE = 
#CUSTOM_TEMPLATE = [Archive call #] -- [ArchiveRef] -- [Volume]
