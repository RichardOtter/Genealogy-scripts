# Configuration data for RootsMagic related Python scripts. (ä)

[FILE_PATHS]

DB_PATH           = TEST.rmtree

RMNOCASE_PATH     = unifuzz64.dll
# or
# RMNOCASE_PATH     = rmnocase_surrogate.dll

REGEXP_PATH       = regexp.dll
# https://github.com/nalgeon/sqlean/blob/main/docs/regexp.md
# https://github.com/nalgeon/sqlean/releases
# sqlean-win-x64.zip


REPORT_FILE_PATH  = REPORT_Citation name updater.txt


REPORT_FILE_DISPLAY_APP  = C:\Windows\system32\Notepad.exe

[FILTER]
USE_REGEXP = off
SOURCE_TEMPLATE = _ChurchBooks -archive/online
SOURCE_NAME = __ChurchBook -Oberschwarzach
